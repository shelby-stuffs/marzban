services:
  marzban:
    image: shelbyhell/marzban:latest
    restart: always
    env_file: .env
    network_mode: host
    volumes:
      - /var/lib/marzban:/var/lib/marzban
      - ./.env:/var/lib/marzban/.env

  db:
    profiles:
      - postgres
    image: timescale/timescaledb:latest-pg16
    restart: always
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marzban}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_DB: ${POSTGRES_DB:-marzban}
    volumes:
      - /var/lib/marzban-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-marzban} -d ${POSTGRES_DB:-marzban}"]
      interval: 5s
      timeout: 5s
      retries: 10
