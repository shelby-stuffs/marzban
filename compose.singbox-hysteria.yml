services:
  marzban:
    build:
      context: .
      args:
        SINGBOX_REF: ${SINGBOX_REF:-v1.14.1-extended-2.7.2}
    environment:
      SINGBOX_ENABLED: "true"
      SINGBOX_EXECUTABLE_PATH: /usr/local/bin/sing-box
      SINGBOX_CONFIG_PATH: /var/lib/marzban/sing-box-hysteria.json
      SINGBOX_HYSTERIA_SETTINGS_PATH: /var/lib/marzban/hysteria2-settings.json
      SINGBOX_ADVANCED_CONFIG_PATH: /var/lib/marzban/sing-box-advanced.json
      SINGBOX_RULE_SETS_PATH: /var/lib/marzban/sing-box-rule-sets.json
      SINGBOX_TRAFFIC_ACCOUNTING_ENABLED: "true"
      SINGBOX_TRAFFIC_API_HOST: 127.0.0.1
      SINGBOX_TRAFFIC_API_PORT: "10085"
      SINGBOX_MANAGE_VLESS: "true"
